# Response headers for Pasta y Gofio.
#
# The app already ships a strict CSP in a <meta> tag, which covers the case
# where you cannot control headers (GitHub Pages). When you *can* set headers —
# your own nginx/Apache at etnoteam.io — prefer these: a real header also
# carries `frame-ancestors`, which browsers ignore in <meta>.

# ---------------------------------------------------------------- nginx ----
# server {
#   root /var/www/pastaygofio;
#
#   add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#   add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
#   add_header Cross-Origin-Opener-Policy "same-origin" always;
#   add_header Cross-Origin-Resource-Policy "same-origin" always;
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#   # Fingerprinted-by-content assets: long cache. HTML, data and the service
#   # worker must revalidate or price changes take a week to reach diners.
#   location ~* \.(woff2|svg|png|jpg|webp|avif)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
#   location ~* \.(html|json|webmanifest)$       { add_header Cache-Control "public, max-age=0, must-revalidate"; }
#   location = /sw.js                            { add_header Cache-Control "no-cache"; }
# }

# ---------------------------------------------------------------- Apache ---
# Copy deploy/apache.htaccess to the document root as .htaccess.
