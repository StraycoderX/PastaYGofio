<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="lgT">
  <title id="lgT">Pasta y Gofio — La Aldea</title>
  <defs>
    <linearGradient id="lgWheat" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3d3227"/>
      <stop offset="1" stop-color="#1e1913"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#f6f0dc"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#2a231a" stroke-width="1.5" opacity="0.35"/>

  <!-- LA ALDEA -->
  <text x="200" y="86" text-anchor="middle" fill="#241d15"
        font-family="Georgia, 'Times New Roman', serif" font-size="46"
        font-style="italic" letter-spacing="3">La Aldea</text>

  <!-- crossed wheat ear + corn cob -->
  <g transform="translate(200 214)" fill="url(#lgWheat)">
    <!-- wheat, leaning left -->
    <g transform="rotate(-16)">
      <path d="M0 74 L0 -34" stroke="#2a231a" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <g>
        <path d="M0 -36 C-9 -46 -9 -60 0 -70 C9 -60 9 -46 0 -36 Z"/>
        <path d="M-3 -22 C-16 -28 -22 -40 -19 -53 C-7 -49 -1 -36 -3 -22 Z"/>
        <path d="M3 -22 C16 -28 22 -40 19 -53 C7 -49 1 -36 3 -22 Z"/>
        <path d="M-3 -4 C-16 -10 -22 -22 -19 -35 C-7 -31 -1 -18 -3 -4 Z"/>
        <path d="M3 -4 C16 -10 22 -22 19 -35 C7 -31 1 -18 3 -4 Z"/>
        <path d="M-3 14 C-16 8 -22 -4 -19 -17 C-7 -13 -1 0 -3 14 Z"/>
        <path d="M3 14 C16 8 22 -4 19 -17 C7 -13 1 0 3 14 Z"/>
        <path d="M-3 32 C-16 26 -22 14 -19 1 C-7 5 -1 18 -3 32 Z"/>
        <path d="M3 32 C16 26 22 14 19 1 C7 5 1 18 3 32 Z"/>
      </g>
      <path d="M0 44 C-14 40 -26 28 -30 12 C-14 16 -3 28 0 44 Z" opacity="0.9"/>
    </g>

    <!-- corn cob, leaning right, husk open -->
    <g transform="rotate(18) translate(16 0)">
      <path d="M0 76 L0 -20" stroke="#2a231a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 -58 C16 -50 24 -28 24 -6 C24 16 14 34 0 42
               C-14 34 -24 16 -24 -6 C-24 -28 -16 -50 0 -58 Z"/>
      <g fill="#f6f0dc" opacity="0.62">
        <path d="M-16 -24 H16 M-20 -10 H20 M-21 4 H21 M-18 18 H18 M-12 30 H12"
              stroke="#f6f0dc" stroke-width="2.6"/>
        <path d="M-8 -46 V38 M8 -46 V38 M0 -54 V40"
              stroke="#f6f0dc" stroke-width="2.6"/>
      </g>
      <path d="M-2 40 C-22 46 -36 62 -40 82 C-20 76 -6 60 -2 40 Z"/>
      <path d="M2 40 C22 46 36 62 40 82 C20 76 6 60 2 40 Z"/>
    </g>
  </g>

  <!-- PASTA Y GOFIO -->
  <text x="200" y="326" text-anchor="middle" fill="#241d15"
        font-family="Georgia, 'Times New Roman', serif" font-size="37"
        letter-spacing="5.5">PASTA Y GOFIO</text>
  <line x1="96" y1="344" x2="304" y2="344" stroke="#241d15" stroke-width="1" opacity="0.5"/>
  <text x="200" y="366" text-anchor="middle" fill="#4a3f31"
        font-family="Georgia, 'Times New Roman', serif" font-size="15"
        letter-spacing="6.5">TRATTORIA · PIZZERIA</text>
</svg>
