<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-labelledby="bt-title bt-desc" preserveAspectRatio="xMidYMid slice">
  <title id="bt-title">Bruschetta de Teror</title>
  <desc id="bt-desc">Base redonda de masa casera con el borde alto y dorado, cubierta de quesos
    fundidos y chorizo de Teror desmigado, servida en bandeja oscura.</desc>

  <defs>
    <radialGradient id="btRoom" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#6b4f36"/>
      <stop offset="0.55" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#1a120b"/>
    </radialGradient>
    <linearGradient id="btWood" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#4a3521" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#241a10" stop-opacity="0.55"/>
    </linearGradient>

    <radialGradient id="btPan" cx="0.42" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#4b4744"/>
      <stop offset="0.6" stop-color="#2c2926"/>
      <stop offset="1" stop-color="#171513"/>
    </radialGradient>

    <!-- puffed, blistered cornicione -->
    <linearGradient id="btCrustRing" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f5d187"/>
      <stop offset="0.42" stop-color="#e0a94c"/>
      <stop offset="0.78" stop-color="#c07f2a"/>
      <stop offset="1" stop-color="#96601b"/>
    </linearGradient>

    <!-- the melted cheese surface: pale, glossy, browned in patches -->
    <radialGradient id="btCheese" cx="0.38" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#fdf3d6"/>
      <stop offset="0.45" stop-color="#f7e5b8"/>
      <stop offset="0.8" stop-color="#eed08c"/>
      <stop offset="1" stop-color="#dcb264"/>
    </radialGradient>

    <!-- chorizo de Teror: soft, deep paprika crumbles -->
    <radialGradient id="btChorizo" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e0612a"/>
      <stop offset="0.5" stop-color="#c2401a"/>
      <stop offset="1" stop-color="#8d2409"/>
    </radialGradient>

    <filter id="btDrop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="btSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="btGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>

    <clipPath id="btInner">
      <circle cx="400" cy="298" r="176"/>
    </clipPath>
  </defs>

  <!-- dark table -->
  <rect width="800" height="600" fill="url(#btRoom)"/>
  <g opacity="0.5">
    <path d="M0 78 H800 M0 214 H800 M0 350 H800 M0 486 H800"
          stroke="#0d0906" stroke-opacity="0.5" stroke-width="4"/>
  </g>
  <rect width="800" height="600" fill="url(#btWood)"/>

  <!-- serving pan -->
  <g filter="url(#btDrop)">
    <circle cx="400" cy="300" r="252" fill="url(#btPan)"/>
    <circle cx="400" cy="300" r="252" fill="none" stroke="#0f0d0b" stroke-width="6" opacity="0.7"/>
    <circle cx="400" cy="300" r="238" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  </g>

  <!-- ===== the dough: round, hand-stretched, high rim ===== -->
  <g>
    <circle cx="400" cy="300" r="222" fill="url(#btCrustRing)"/>

    <!-- char blisters around the rim -->
    <g fill="#6f3f10" opacity="0.55">
      <ellipse cx="400" cy="88" rx="30" ry="13"/>
      <ellipse cx="546" cy="132" rx="24" ry="12" transform="rotate(35 546 132)"/>
      <ellipse cx="608" cy="252" rx="13" ry="26"/>
      <ellipse cx="584" cy="404" rx="20" ry="13" transform="rotate(-38 584 404)"/>
      <ellipse cx="452" cy="508" rx="27" ry="12"/>
      <ellipse cx="288" cy="492" rx="22" ry="13" transform="rotate(28 288 492)"/>
      <ellipse cx="196" cy="376" rx="13" ry="24" transform="rotate(18 196 376)"/>
      <ellipse cx="200" cy="216" rx="17" ry="24" transform="rotate(-30 200 216)"/>
      <ellipse cx="300" cy="112" rx="22" ry="12" transform="rotate(-28 300 112)"/>
    </g>
    <g fill="#ffe0a4" opacity="0.45">
      <ellipse cx="356" cy="98" rx="34" ry="12"/>
      <ellipse cx="220" cy="242" rx="12" ry="26" transform="rotate(-16 220 242)"/>
      <ellipse cx="516" cy="482" rx="26" ry="11" transform="rotate(24 516 482)"/>
    </g>

    <!-- shadow where the rim rises above the filling -->
    <circle cx="400" cy="298" r="180" fill="#8a5615" opacity="0.5"/>

    <!-- ===== quesos fundidos: covers the whole base ===== -->
    <circle cx="400" cy="298" r="176" fill="url(#btCheese)"/>

    <g clip-path="url(#btInner)">
      <!-- where the cheese caught the oven -->
      <g fill="#c48a3c" opacity="0.42">
        <ellipse cx="318" cy="212" rx="42" ry="26" transform="rotate(-18 318 212)"/>
        <ellipse cx="470" cy="196" rx="34" ry="21" transform="rotate(12 470 196)"/>
        <ellipse cx="530" cy="322" rx="38" ry="24" transform="rotate(-8 530 322)"/>
        <ellipse cx="286" cy="360" rx="36" ry="22" transform="rotate(22 286 360)"/>
        <ellipse cx="404" cy="418" rx="44" ry="24" transform="rotate(-6 404 418)"/>
        <ellipse cx="392" cy="292" rx="30" ry="19"/>
      </g>
      <g fill="#8f5a1c" opacity="0.3">
        <ellipse cx="330" cy="206" rx="17" ry="10" transform="rotate(-18 330 206)"/>
        <ellipse cx="524" cy="330" rx="15" ry="9"/>
        <ellipse cx="414" cy="424" rx="19" ry="10"/>
        <ellipse cx="276" cy="356" rx="14" ry="9"/>
      </g>
      <!-- glossy, molten highlights -->
      <g fill="#fffaeb" opacity="0.55">
        <ellipse cx="352" cy="232" rx="52" ry="24" transform="rotate(-14 352 232)"/>
        <ellipse cx="466" cy="268" rx="34" ry="16" transform="rotate(10 466 268)"/>
        <ellipse cx="318" cy="316" rx="28" ry="13"/>
      </g>

      <!-- ===== chorizo de Teror, desmigado por encima ===== -->
      <g>
        <path d="M300 178 c14 -10 30 -6 34 6 c4 12 -8 22 -22 22 c-16 0 -24 -18 -12 -28 Z" fill="url(#btChorizo)" transform="rotate(-25 300 178) translate(300 178) scale(0.87 0.87) translate(-300 -178)"/>
        <path d="M436 164 c16 -6 30 4 28 16 c-2 14 -20 20 -32 12 c-11 -7 -9 -24 4 -28 Z" fill="url(#btChorizo)" transform="rotate(-60 436 164) translate(436 164) scale(1.09 0.76) translate(-436 -164)"/>
        <path d="M528 226 c15 -4 27 6 24 18 c-3 13 -20 18 -30 9 c-10 -8 -7 -24 6 -27 Z" fill="url(#btChorizo)" transform="rotate(-62 528 226) translate(528 226) scale(1.07 0.63) translate(-528 -226)"/>
        <path d="M556 320 c14 2 22 15 16 26 c-7 12 -25 12 -32 1 c-7 -11 2 -29 16 -27 Z" fill="url(#btChorizo)" transform="rotate(-9 556 320) translate(556 320) scale(0.82 0.65) translate(-556 -320)"/>
        <path d="M482 386 c16 -8 32 2 31 15 c-1 14 -19 21 -31 13 c-11 -7 -11 -23 0 -28 Z" fill="url(#btChorizo)" transform="rotate(-11 482 386) translate(482 386) scale(1.25 0.67) translate(-482 -386)"/>
        <path d="M370 404 c17 -5 30 6 27 19 c-3 14 -22 19 -32 9 c-10 -9 -6 -25 5 -28 Z" fill="url(#btChorizo)" transform="rotate(-39 370 404) translate(370 404) scale(1.14 0.98) translate(-370 -404)"/>
        <path d="M262 344 c15 -8 31 0 31 13 c0 14 -17 22 -29 15 c-12 -7 -13 -22 -2 -28 Z" fill="url(#btChorizo)" transform="rotate(11 262 344) translate(262 344) scale(1.01 0.99) translate(-262 -344)"/>
        <path d="M246 244 c14 -7 29 1 29 14 c0 13 -16 21 -27 14 c-12 -7 -13 -22 -2 -28 Z" fill="url(#btChorizo)" transform="rotate(-63 246 244) translate(246 244) scale(1.27 0.73) translate(-246 -244)"/>
        <path d="M394 258 c17 -7 33 4 30 17 c-3 14 -22 20 -33 11 c-10 -8 -8 -24 3 -28 Z" fill="url(#btChorizo)" transform="rotate(-50 394 258) translate(394 258) scale(0.85 0.74) translate(-394 -258)"/>
        <path d="M462 306 c12 -4 22 4 20 14 c-2 11 -16 15 -24 8 c-8 -6 -6 -19 4 -22 Z" fill="url(#btChorizo)" transform="rotate(44 462 306) translate(462 306) scale(0.88 0.84) translate(-462 -306)"/>
        <path d="M330 306 c11 -5 22 2 21 12 c-1 11 -14 16 -22 10 c-9 -6 -8 -19 1 -22 Z" fill="url(#btChorizo)" transform="rotate(19 330 306) translate(330 306) scale(0.99 0.83) translate(-330 -306)"/>
        <path d="M420 352 c11 -4 21 3 20 13 c-1 10 -14 15 -22 9 c-8 -6 -7 -19 2 -22 Z" fill="url(#btChorizo)" transform="rotate(-61 420 352) translate(420 352) scale(0.81 0.70) translate(-420 -352)"/>
        <path d="M292 396 c10 -4 19 2 18 11 c-1 10 -12 14 -19 8 c-8 -5 -7 -17 1 -19 Z" fill="url(#btChorizo)" transform="rotate(25 292 396) translate(292 396) scale(1.02 0.74) translate(-292 -396)"/>
        <path d="M516 262 c10 -4 19 2 18 11 c-1 10 -12 14 -19 8 c-8 -5 -7 -17 1 -19 Z" fill="url(#btChorizo)" transform="rotate(12 516 262) translate(516 262) scale(1.04 0.73) translate(-516 -262)"/>
        <path d="M352 176 c9 -4 18 2 17 10 c-1 9 -12 13 -18 7 c-7 -5 -6 -15 1 -17 Z" fill="url(#btChorizo)" transform="rotate(41 352 176) translate(352 176) scale(1.18 0.71) translate(-352 -176)"/>

        <!-- paprika grain and the rendered fat around each crumble -->
        <g fill="#5e1503" opacity="0.5">
          <circle cx="316" cy="192" r="3.5"/><circle cx="450" cy="176" r="3"/>
          <circle cx="538" cy="238" r="3.2"/><circle cx="566" cy="332" r="3"/>
          <circle cx="494" cy="398" r="3.4"/><circle cx="382" cy="416" r="3"/>
          <circle cx="274" cy="356" r="3.2"/><circle cx="258" cy="256" r="3"/>
          <circle cx="408" cy="270" r="3.4"/>
        </g>
        <g fill="#ffb27f" opacity="0.34">
          <ellipse cx="326" cy="186" rx="12" ry="4" transform="rotate(-14 326 186)"/>
          <ellipse cx="456" cy="170" rx="11" ry="4" transform="rotate(10 456 170)"/>
          <ellipse cx="380" cy="410" rx="12" ry="4"/>
          <ellipse cx="548" cy="316" rx="10" ry="4" transform="rotate(-20 548 316)"/>
        </g>
      </g>

      <!-- oil sheen across the top left -->
      <ellipse cx="332" cy="228" rx="128" ry="62" fill="#fff6de" opacity="0.1" filter="url(#btSoft)"/>
    </g>

    <!-- rim edges -->
    <circle cx="400" cy="298" r="176" fill="none" stroke="#a3671c" stroke-opacity="0.5" stroke-width="4"/>
    <circle cx="400" cy="300" r="222" fill="none" stroke="#7d4d12" stroke-opacity="0.45" stroke-width="3"/>
  </g>

  <!-- a scatter of thyme on the pan -->
  <g opacity="0.6" fill="#5d8a3c">
    <ellipse cx="640" cy="500" rx="7" ry="3" transform="rotate(24 640 500)"/>
    <ellipse cx="664" cy="486" rx="6" ry="2.6" transform="rotate(-12 664 486)"/>
    <ellipse cx="150" cy="128" rx="6" ry="2.6" transform="rotate(40 150 128)"/>
  </g>

  <rect width="800" height="600" filter="url(#btGrain)" opacity="0.35" pointer-events="none"/>
</svg>
