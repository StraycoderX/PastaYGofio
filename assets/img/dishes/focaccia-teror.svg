<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-labelledby="fc-title fc-desc" preserveAspectRatio="xMidYMid slice">
  <title id="fc-title">Bruschetta de Teror sobre masa casera de focaccia</title>
  <desc id="fc-desc">Focaccia de masa casera, gruesa y alveolada, cubierta de chorizo de Teror,
    mozzarella fundida, tomate fresco y albahaca.</desc>

  <defs>
    <linearGradient id="fcBoard" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3a2a20"/>
      <stop offset="0.55" stop-color="#2a1d16"/>
      <stop offset="1" stop-color="#1c130e"/>
    </linearGradient>
    <radialGradient id="fcGlow" cx="0.42" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#ffc978" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ff9a3c" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="fcSlate" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a4741"/>
      <stop offset="0.5" stop-color="#33312d"/>
      <stop offset="1" stop-color="#232120"/>
    </linearGradient>

    <!-- baked focaccia top: olive-oil gold with darker blistered edges -->
    <linearGradient id="fcCrustTop" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f0c069"/>
      <stop offset="0.35" stop-color="#e2a544"/>
      <stop offset="0.7" stop-color="#cf8a2e"/>
      <stop offset="1" stop-color="#b26f22"/>
    </linearGradient>
    <!-- cut side of the dough: pale, open crumb -->
    <linearGradient id="fcCrumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3bb"/>
      <stop offset="0.45" stop-color="#eed6a6"/>
      <stop offset="1" stop-color="#d8b478"/>
    </linearGradient>
    <linearGradient id="fcCrustSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98328"/>
      <stop offset="1" stop-color="#96601c"/>
    </linearGradient>

    <!-- chorizo de Teror: soft, spreadable, deep paprika red -->
    <linearGradient id="fcChorizo" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d4451f"/>
      <stop offset="0.5" stop-color="#b82f14"/>
      <stop offset="1" stop-color="#8e1f0d"/>
    </linearGradient>
    <radialGradient id="fcChorizoHi" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>

    <!-- melted mozzarella -->
    <radialGradient id="fcMozz" cx="0.36" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.55" stop-color="#f7efdc"/>
      <stop offset="1" stop-color="#e4d5b6"/>
    </radialGradient>
    <linearGradient id="fcTomato" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f0512f"/>
      <stop offset="1" stop-color="#c22a18"/>
    </linearGradient>
    <linearGradient id="fcBasil" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#63a83f"/>
      <stop offset="1" stop-color="#2f6b25"/>
    </linearGradient>

    <filter id="fcSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="fcDrop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="fcGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06" intercept="0"/></feComponentTransfer>
    </filter>

    <clipPath id="fcTopClip">
      <path d="M138 214 C176 176 246 160 336 156 C452 151 566 158 638 178
               C688 192 700 214 692 246 C682 288 664 330 640 362
               C614 398 540 414 424 418 C306 422 218 410 174 384
               C142 366 130 330 130 288 C130 258 130 232 138 214 Z"/>
    </clipPath>
  </defs>

  <!-- table -->
  <rect width="800" height="600" fill="url(#fcBoard)"/>
  <g opacity="0.5">
    <path d="M0 96 H800 M0 232 H800 M0 368 H800 M0 504 H800"
          stroke="#000" stroke-opacity="0.28" stroke-width="3"/>
  </g>
  <rect width="800" height="600" fill="url(#fcGlow)"/>

  <!-- slate serving board -->
  <g filter="url(#fcDrop)">
    <path d="M92 176 C92 152 116 138 152 134 L664 118 C706 116 726 134 726 162
             L722 424 C720 456 700 474 660 478 L152 496 C112 498 90 480 90 450 Z"
          fill="url(#fcSlate)"/>
    <path d="M92 176 C92 152 116 138 152 134 L664 118 C706 116 726 134 726 162 L726 178
             C700 164 620 156 470 154 C300 152 160 162 92 190 Z"
          fill="#ffffff" opacity="0.07"/>
  </g>

  <!-- ===== the focaccia: thick, hand-stretched, home-made dough ===== -->
  <g filter="url(#fcDrop)">
    <!-- depth: the slab is tall, this is dough, not a slice of loaf -->
    <path d="M130 288 C130 330 142 366 174 384 C218 410 306 422 424 418
             C540 414 614 398 640 362 L640 428 C614 464 540 480 424 484
             C306 488 218 476 174 450 C142 432 130 396 130 354 Z"
          fill="url(#fcCrustSide)"/>
    <!-- open, airy crumb along the cut face -->
    <path d="M152 372 C200 402 300 416 424 412 C520 409 590 396 626 374
             L626 424 C590 448 520 462 424 465 C300 469 200 454 152 424 Z"
          fill="url(#fcCrumb)"/>
    <g fill="#c9a271" opacity="0.85">
      <ellipse cx="214" cy="418" rx="17" ry="13"/>
      <ellipse cx="266" cy="434" rx="11" ry="9"/>
      <ellipse cx="318" cy="416" rx="21" ry="15"/>
      <ellipse cx="382" cy="436" rx="13" ry="10"/>
      <ellipse cx="438" cy="418" rx="18" ry="13"/>
      <ellipse cx="500" cy="434" rx="12" ry="9"/>
      <ellipse cx="552" cy="416" rx="16" ry="12"/>
      <ellipse cx="600" cy="430" rx="10" ry="8"/>
      <ellipse cx="180" cy="436" rx="9" ry="7"/>
      <ellipse cx="352" cy="404" rx="9" ry="7"/>
      <ellipse cx="470" cy="440" rx="9" ry="7"/>
    </g>
    <g fill="#8f6a3c" opacity="0.35">
      <ellipse cx="214" cy="421" rx="10" ry="7"/>
      <ellipse cx="318" cy="419" rx="12" ry="8"/>
      <ellipse cx="438" cy="421" rx="10" ry="7"/>
      <ellipse cx="552" cy="418" rx="9" ry="6"/>
    </g>

    <!-- baked top surface -->
    <path d="M138 214 C176 176 246 160 336 156 C452 151 566 158 638 178
             C688 192 700 214 692 246 C682 288 664 330 640 362
             C614 398 540 414 424 418 C306 422 218 410 174 384
             C142 366 130 330 130 288 C130 258 130 232 138 214 Z"
          fill="url(#fcCrustTop)"/>

    <g clip-path="url(#fcTopClip)">
      <!-- the dimples that only hand-pressed focaccia dough has -->
      <g fill="#a9661d" opacity="0.5">
        <ellipse cx="196" cy="238" rx="15" ry="11"/>
        <ellipse cx="268" cy="212" rx="13" ry="9"/>
        <ellipse cx="356" cy="228" rx="16" ry="11"/>
        <ellipse cx="452" cy="204" rx="13" ry="9"/>
        <ellipse cx="546" cy="222" rx="15" ry="10"/>
        <ellipse cx="628" cy="248" rx="12" ry="9"/>
        <ellipse cx="182" cy="318" rx="14" ry="10"/>
        <ellipse cx="252" cy="356" rx="12" ry="9"/>
        <ellipse cx="600" cy="330" rx="14" ry="10"/>
        <ellipse cx="662" cy="292" rx="11" ry="8"/>
      </g>
      <g fill="#ffd98f" opacity="0.45">
        <ellipse cx="196" cy="233" rx="9" ry="5"/>
        <ellipse cx="356" cy="223" rx="9" ry="5"/>
        <ellipse cx="546" cy="217" rx="8" ry="5"/>
        <ellipse cx="182" cy="313" rx="8" ry="5"/>
        <ellipse cx="600" cy="325" rx="8" ry="5"/>
      </g>
      <!-- blistered, oil-brushed edges -->
      <path d="M130 262 C160 236 230 220 340 214 C470 207 610 216 692 240
               L692 214 C610 190 470 180 340 187 C230 193 158 210 132 232 Z"
            fill="#a05f18" opacity="0.32"/>
      <ellipse cx="330" cy="196" rx="200" ry="24" fill="#ffe1a4" opacity="0.12" filter="url(#fcSoft)"/>

      <!-- ===== chorizo de Teror, spread across the dough ===== -->
      <g>
        <path d="M206 268 C244 244 300 236 366 240 C446 245 522 240 580 252
                 C620 260 632 280 620 302 C606 328 560 344 486 350
                 C400 357 306 352 250 336 C206 323 190 296 206 268 Z"
              fill="url(#fcChorizo)"/>
        <path d="M206 268 C244 244 300 236 366 240 C446 245 522 240 580 252
                 C620 260 632 280 620 302 C606 328 560 344 486 350
                 C400 357 306 352 250 336 C206 323 190 296 206 268 Z"
              fill="url(#fcChorizoHi)"/>
        <!-- paprika flecks + fat marbling of the sobrasada-style spread -->
        <g fill="#5f1206" opacity="0.5">
          <circle cx="262" cy="288" r="4"/><circle cx="318" cy="272" r="3"/>
          <circle cx="372" cy="300" r="4.5"/><circle cx="430" cy="278" r="3.5"/>
          <circle cx="492" cy="302" r="4"/><circle cx="548" cy="284" r="3"/>
          <circle cx="288" cy="322" r="3.5"/><circle cx="402" cy="330" r="3"/>
          <circle cx="516" cy="330" r="3.5"/><circle cx="576" cy="308" r="3"/>
        </g>
        <g fill="#ffb08a" opacity="0.35">
          <ellipse cx="300" cy="262" rx="20" ry="7" transform="rotate(-6 300 262)"/>
          <ellipse cx="456" cy="264" rx="24" ry="6" transform="rotate(4 456 264)"/>
          <ellipse cx="360" cy="318" rx="18" ry="6" transform="rotate(-3 360 318)"/>
        </g>
      </g>

      <!-- ===== mozzarella, melted over the chorizo ===== -->
      <g>
        <ellipse cx="284" cy="272" rx="44" ry="27" fill="url(#fcMozz)"/>
        <ellipse cx="402" cy="260" rx="52" ry="29" fill="url(#fcMozz)"/>
        <ellipse cx="526" cy="276" rx="45" ry="26" fill="url(#fcMozz)"/>
        <ellipse cx="338" cy="328" rx="39" ry="22" fill="url(#fcMozz)"/>
        <ellipse cx="472" cy="330" rx="42" ry="22" fill="url(#fcMozz)"/>
        <ellipse cx="594" cy="302" rx="26" ry="16" fill="url(#fcMozz)"/>
        <ellipse cx="228" cy="310" rx="26" ry="16" fill="url(#fcMozz)"/>
        <!-- browned bubbles where the cheese caught the oven -->
        <g fill="#d9a55f" opacity="0.5">
          <ellipse cx="264" cy="258" rx="13" ry="8"/>
          <ellipse cx="392" cy="244" rx="16" ry="9"/>
          <ellipse cx="540" cy="266" rx="12" ry="8"/>
          <ellipse cx="352" cy="336" rx="11" ry="7"/>
          <ellipse cx="486" cy="338" rx="13" ry="8"/>
        </g>
        <g fill="#ffffff" opacity="0.55">
          <ellipse cx="382" cy="248" rx="26" ry="10"/>
          <ellipse cx="272" cy="264" rx="18" ry="7"/>
          <ellipse cx="512" cy="270" rx="20" ry="8"/>
        </g>
      </g>

      <!-- fresh tomato -->
      <g>
        <path d="M320 292 l30 -8 10 26 -30 9 Z" fill="url(#fcTomato)"/>
        <path d="M436 300 l28 -10 12 24 -28 11 Z" fill="url(#fcTomato)"/>
        <path d="M252 330 l26 -9 10 22 -26 10 Z" fill="url(#fcTomato)"/>
        <path d="M544 316 l27 -9 10 23 -27 10 Z" fill="url(#fcTomato)"/>
        <g fill="#ff8f6b" opacity="0.5">
          <path d="M322 290 l26 -7 4 9 -26 8 Z"/>
          <path d="M438 298 l24 -8 4 8 -24 9 Z"/>
        </g>
      </g>

      <!-- basil -->
      <g>
        <path d="M356 216 C378 200 406 202 418 218 C404 236 374 238 356 216 Z" fill="url(#fcBasil)"/>
        <path d="M356 216 C380 210 402 212 418 218" stroke="#1f4d19" stroke-width="2.5" fill="none"/>
        <path d="M486 232 C506 216 534 218 546 234 C532 252 504 254 486 232 Z" fill="url(#fcBasil)"/>
        <path d="M486 232 C508 226 530 228 546 234" stroke="#1f4d19" stroke-width="2.5" fill="none"/>
        <path d="M262 344 C282 330 308 332 320 346 C306 364 280 366 262 344 Z" fill="url(#fcBasil)"/>
        <path d="M262 344 C284 338 304 340 320 346" stroke="#1f4d19" stroke-width="2.5" fill="none"/>
      </g>

      <!-- olive-oil sheen -->
      <ellipse cx="360" cy="248" rx="130" ry="34" fill="#fff3d0" opacity="0.08" filter="url(#fcSoft)"/>
    </g>

    <!-- rim of the top face -->
    <path d="M138 214 C176 176 246 160 336 156 C452 151 566 158 638 178
             C688 192 700 214 692 246 C682 288 664 330 640 362
             C614 398 540 414 424 418 C306 422 218 410 174 384
             C142 366 130 330 130 288 C130 258 130 232 138 214 Z"
          fill="none" stroke="#8f5a16" stroke-opacity="0.45" stroke-width="3"/>
  </g>

  <!-- scattered rosemary + salt on the board -->
  <g opacity="0.75">
    <path d="M700 452 l34 -12" stroke="#4f7a35" stroke-width="4" stroke-linecap="round"/>
    <path d="M706 446 l8 -9 M716 442 l7 -10 M726 439 l7 -9" stroke="#4f7a35" stroke-width="3" stroke-linecap="round"/>
    <g fill="#f3ead6">
      <circle cx="676" cy="474" r="3"/><circle cx="694" cy="486" r="2.4"/>
      <circle cx="712" cy="470" r="2.8"/><circle cx="120" cy="512" r="2.6"/>
      <circle cx="146" cy="524" r="2.2"/>
    </g>
  </g>

  <rect width="800" height="600" filter="url(#fcGrain)" opacity="0.35" pointer-events="none"/>
</svg>
